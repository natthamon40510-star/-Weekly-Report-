    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          var str = String((event && event.reason && (event.reason.message || event.reason)) || '');
          if (str.indexOf('Pending promise was never set') !== -1 || str.indexOf('auth/popup-closed-by-user') !== -1 || str.indexOf('auth/cancelled-popup-request') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = String((event && event.message) || '');
          if (msg.indexOf('Pending promise was never set') !== -1 || msg.indexOf('auth/popup-closed-by-user') !== -1 || msg.indexOf('auth/cancelled-popup-request') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
